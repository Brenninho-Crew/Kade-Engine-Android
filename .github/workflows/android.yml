name: Android Build CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime          7.9.0   --quiet
          haxelib install openfl        9.1.0   --quiet
          haxelib install flixel        4.11.0  --quiet
          haxelib install flixel-addons 2.11.0  --quiet
          haxelib install flixel-ui     2.4.0   --quiet
          haxelib install hscript       2.5.0   --quiet
          haxelib install actuate       1.9.0   --quiet
          haxelib git polymod https://github.com/MasterEric/polymod.git --quiet
          haxelib run lime setup

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK        $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT   $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME          $JAVA_HOME
          haxelib run lime config ANDROID_SETUP      true

      - name: Build APK
        run: haxelib run lime build android -release

      - uses: actions/upload-artifact@v4
        with:
          name: KadeEngine-Android
          path: export/android/release/bin/app/build/outputs/apk/release/*.apk